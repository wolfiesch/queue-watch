[project]
name = "queue-watch"
version = "0.1.0"
description = "Read-only terminal dashboard for CI runs and merge queues, with mouse support"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["textual>=6,<7"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]

[project.scripts]
queue-watch = "queue_watch.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-textual-snapshot>=1.0.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
